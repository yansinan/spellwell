<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpellWell · 内容后台（P7）</title>
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <link rel="stylesheet" href="../../styles/app.css" />
  </head>
  <body class="sw-app">
    <main class="sw-shell">
      <header class="sw-hero">
        <p class="sw-eyebrow">CONTENT ADMIN</p>
        <h1 class="sw-title">内容后台 <span class="sw-title__cn">P7</span></h1>
        <p class="sw-lede">人工标注切分、组合库、混淆项、句子库与导出校验。</p>
        <p class="sw-admin__muted">请通过 HTTP 打开：<code>node tools/serve.mjs</code> → <code>http://127.0.0.1:4173/src/admin/index.html</code></p>
      </header>
      <div id="admin-root"><p class="sw-lede">加载中…</p></div>
    </main>
    <script type="module">
      import { mountAdmin } from './AdminApp.js';
      mountAdmin(document.getElementById('admin-root')).catch((error) => {
        console.error(error);
        document.getElementById('admin-root').textContent = String(error);
      });
    </script>
