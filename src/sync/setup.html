<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpellWell · 同步设置</title>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/app.css" />
  </head>
  <body class="sw-app">
    <main class="sw-shell">
      <header class="sw-hero">
        <p class="sw-eyebrow">SYNC SETUP</p>
        <h1 class="sw-title">同步设置</h1>
        <p class="sw-lede">配对已有用户，或创建一个独立的新用户。浏览器仍使用本机 IndexedDB。</p>
        <p class="sw-admin__muted"><a href="/">返回练习</a></p>
      </header>
      <div id="sync-panel"></div>
    </main>
    <script type="module">
      import { IndexedDBAdapter } from '/src/storage/IndexedDBAdapter.js';
      import { mountSyncAdmin } from '/src/admin/SyncAdmin.js';

      let adapter = null;
      try {
        adapter = new IndexedDBAdapter();
        await adapter.init();
      } catch (error) {
        console.warn('[SpellWell] IndexedDB unavailable on sync setup', error);
      }
      await mountSyncAdmin(document.querySelector('#sync-panel'), { adapter, deviceName: '浏览器' });
    </script>
  </body>
</html>
